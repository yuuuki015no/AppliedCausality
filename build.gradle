plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def noMekanismGameTest = providers.gradleProperty('noMekanismGameTest').isPresent()
def phase21Performance = providers.gradleProperty('phase21Performance').isPresent()
def chemicalFoundationGameTest = providers.gradleProperty('chemicalFoundationGameTest').isPresent()
if (chemicalFoundationGameTest && noMekanismGameTest) {
    throw new GradleException('chemicalFoundationGameTest requires Mekanism')
}
def isRunClientRequested = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'runClient'
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        if (chemicalFoundationGameTest) {
            java.srcDir 'src/chemicalGameTest/java'
        }
        if (noMekanismGameTest) {
            java.srcDir 'src/noMekanismGameTest/java'
            java.exclude 'dev/appliedcausality/gametest/Phase15MekanismAdapterGameTests.java'
            java.exclude 'dev/appliedcausality/gametest/PackAddedMekanismRecipeGameTests.java'
            java.exclude 'dev/appliedcausality/gametest/MekanismCombiningGameTests.java'
            resources.exclude 'data/applied_causality/recipes/phase15_*.json'
            resources.exclude 'data/pack_test/**'
        }
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            args '--mixin.config', 'applied_causality.mixins.json'
            args '--mixin.config', 'applied_causality.advancedae.mixins.json'

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Remap refmaps from binary mod dependencies (including AE2) into the official-mapped userdev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            if (phase21Performance) {
                workingDirectory project.file('run/phase21-performance')
            }
            property 'forge.enabledGameTestNamespaces', phase21Performance
                    ? 'applied_causality_phase21'
                    : mod_id
            if (phase21Performance) {
                args '--mixin.config', 'applied_causality.phase21.mixins.json'
            }

            mods {
                "${mod_id}" {
                    source sourceSets.gameTest
                }
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'mekanism'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'JaredsMaven'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // Mekanism remains optional for consumers and normal development runtimes.
    // Compile against its published API; add the exact full release only to
    // tests that exercise the integration.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    // Chemical AEKey is supplied by this optional addon at runtime.
    compileOnly fg.deobf('curse.maven:applied-mekanistics-574300:7244744')

    // Optional production integration: compile against the exact supported
    // release, but do not expose AdvancedAE as a required transitive mod.
    compileOnly fg.deobf("curse.maven:advancedae-1084104:${advanced_ae_curse_file}")
    runtimeOnly fg.deobf("curse.maven:advancedae-1084104:${advanced_ae_curse_file}")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:${phase21Performance ? '7553267' : geckolib_curse_file}")

    // Full Mekanism and JEI are conveniences for interactive client checks only.
    // Keeping them conditional prevents either from entering normal server
    // runtimes or becoming part of the published mod's dependency contract.
    if (isRunClientRequested) {
        runtimeOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
        runtimeOnly fg.deobf('curse.maven:applied-mekanistics-574300:7244744')
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation fg.deobf("mekanism:Mekanism:${mekanism_version}")
    gameTestCompileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
    if (!noMekanismGameTest) {
        gameTestRuntimeOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")
    }
    if (chemicalFoundationGameTest) {
        gameTestCompileOnly fg.deobf('curse.maven:applied-mekanistics-574300:7244744')
        gameTestRuntimeOnly fg.deobf('curse.maven:applied-mekanistics-574300:7244744')
    }
    if (phase21Performance) {
        // Exact optional modpack used only by the isolated Phase 21 comparison.
        // Curse artifacts have no transitive metadata, so Astral's source-verified
        // mandatory runtime graph is listed explicitly.
        gameTestRuntimeOnly fg.deobf("curse.maven:astral-mekanism-1415150:8601842")
        gameTestRuntimeOnly fg.deobf("curse.maven:mekanism-generators-268566:6552914")
        gameTestRuntimeOnly fg.deobf("curse.maven:mekanism-tools-268567:6552915")
        gameTestRuntimeOnly fg.deobf("curse.maven:evolved-mekanism-1230085:7599591")
        gameTestRuntimeOnly fg.deobf("curse.maven:evolved-mekanism-extras-1268159:8294797")
        gameTestRuntimeOnly fg.deobf("curse.maven:mekanism-elements-1103224:6537553")
        gameTestRuntimeOnly fg.deobf("curse.maven:mekanism-extras-1026040:8247562")
        gameTestRuntimeOnly fg.deobf("curse.maven:iglee-library-541199:6987117")
        gameTestRuntimeOnly fg.deobf("curse.maven:compact-mekanism-machines-1161015:7388773")
        gameTestRuntimeOnly fg.deobf("curse.maven:stack-upgrade-integration-1510741:8298822")
        gameTestRuntimeOnly fg.deobf("curse.maven:applied-mekanistics-574300:7244744")
        gameTestRuntimeOnly fg.deobf("curse.maven:ae2addonlib-1366135:7668681")
        gameTestRuntimeOnly fg.deobf("curse.maven:applied-energistics-2-wireless-terminals-459929:7251206")
        gameTestRuntimeOnly fg.deobf("curse.maven:cloth-config-348521:5729105")
        gameTestRuntimeOnly fg.deobf("curse.maven:architectury-api-419699:5137938")
        gameTestRuntimeOnly fg.deobf("curse.maven:curios-309927:6418456")
        gameTestRuntimeOnly fg.deobf("curse.maven:mega-cells-622112:6175008")
        gameTestRuntimeOnly fg.deobf("curse.maven:glodium-957920:5226922")
        gameTestRuntimeOnly fg.deobf("curse.maven:applied-flux-965012:7651647")
        gameTestRuntimeOnly fg.deobf("curse.maven:botany-pots-353928:7612402")
        gameTestRuntimeOnly fg.deobf("curse.maven:bookshelf-228525:5423987")
        gameTestRuntimeOnly fg.deobf("curse.maven:jade-324717:6855440")
        gameTestRuntimeOnly fg.deobf("curse.maven:kotlin-for-forge-351264:7291067")
        gameTestRuntimeOnly fg.deobf("curse.maven:mekanism-more-machine-1275257:7884538")
        gameTestRuntimeOnly fg.deobf("curse.maven:morethermalevaporation-1406469:8108411")
    }
    testImplementation fg.deobf("curse.maven:advancedae-1084104:${advanced_ae_curse_file}")
    gameTestImplementation fg.deobf("curse.maven:advancedae-1084104:${advanced_ae_curse_file}")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    // Ship the initial rule files as classpath resources for first-run installation.
    from('examples/config') {
        into 'applied_causality/config_defaults'
        include 'appliedcausality/rules/*.toml'
    }

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            ae2_version_range: ae2_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// One explicit publication list for the source ZIP and fresh public checkouts.
def publicSourceIncludes = [
        'src/**', 'examples/config/**',
        'build.gradle', 'settings.gradle', 'gradle.properties',
        'gradlew', 'gradlew.bat', 'gradle/wrapper/**',
        '.gitignore', '.gitattributes',
        'README.md', 'CHANGELOG.md', 'BUILDING.md', 'LICENSE.txt', 'NOTICE.txt',
        'docs/README.md', 'docs/CONFIG_RULES.md',
        'licenses/Apache-2.0.txt', 'licenses/AE2-LICENSE.txt',
        'licenses/Forge-MDK-LICENSE.txt', 'licenses/Forge-MDK-CREDITS.txt'
]
def publicSourceFiles = fileTree(projectDir) {
    include publicSourceIncludes
    exclude 'src/**/.cache/**'
}
def publicSourceSpec = copySpec {
    from(publicSourceFiles) {
        filteringCharset = 'UTF-8'
        filesMatching('gradle.properties') {
            // The public build uses the documented JDK 17 setup, not a local path.
            filter { line -> line.startsWith('org.gradle.java.home=') ? null : line }
        }
    }
}
def verifyPublicDocuments = {
    def missing = publicSourceIncludes.findAll { !it.contains('*') && !file(it).isFile() }
    if (!missing.isEmpty()) {
        throw new GradleException("Required public files are missing: ${missing}")
    }
    def unexpected = publicSourceFiles.files.findAll { sourceFile ->
        def relative = projectDir.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
        def isDocument = relative.toLowerCase(Locale.ROOT).endsWith('.md') ||
                relative.toLowerCase(Locale.ROOT).endsWith('.txt')
        isDocument && !publicSourceIncludes.contains(relative)
    }
    if (!unexpected.isEmpty()) {
        throw new GradleException("Add intended public documents explicitly before exporting: ${unexpected}")
    }
}

// Complete corresponding source, with only user-facing documents.
def releaseSources = tasks.register('releaseSources', Zip) {
    group = 'distribution'
    description = 'Packages corresponding source and build instructions for the release JAR.'
    archiveClassifier = 'sources'
    archiveExtension = 'zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    with publicSourceSpec
    doFirst { verifyPublicDocuments() }
}

// Every export is a new folder; no development history or old checkout is copied.
tasks.register('preparePublicSource') {
    group = 'distribution'
    description = 'Creates a fresh GitHub source folder without private documents or Git history.'
    doLast {
        def exportDirectory = file("build/public-source/${mod_id}-${mod_version}-${UUID.randomUUID()}")
        def expectedRoot = projectDir.canonicalFile.toPath().resolve('build/public-source')
        if (!exportDirectory.canonicalFile.toPath().startsWith(expectedRoot) || exportDirectory.exists()) {
            throw new GradleException('Public source export requires a new folder under build/public-source.')
        }
        verifyPublicDocuments()
        copy {
            with publicSourceSpec
            into exportDirectory
            includeEmptyDirs = false
        }
        logger.lifecycle("Public source prepared: ${exportDirectory}")
    }
}

tasks.named('build').configure { dependsOn releaseSources }

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    // Keep player guidance and third-party notices available in the MOD download.
    from(projectDir) {
        include 'README.md', 'CHANGELOG.md', 'BUILDING.md', 'LICENSE.txt', 'NOTICE.txt'
        include 'docs/README.md', 'docs/CONFIG_RULES.md'
        include 'examples/config/**/*.toml'
        include 'licenses/*.txt'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'applied_causality.mixins.json,applied_causality.advancedae.mixins.json'
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('benchmarkBulkDispatch', JavaExec) {
    group = 'verification'
    description = 'Runs the Phase 21 fake/in-memory Bulk dispatch benchmark.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.appliedcausality.internal.bulk.BulkDispatchPerformanceBenchmark'
    minHeapSize = '1g'
    maxHeapSize = '2g'
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/gameTest/resources/gameteststructures'
    into phase21Performance
            ? 'run/phase21-performance/gameteststructures'
            : 'run/gameteststructures'
}

tasks.configureEach {
    if (name == 'runGameTestServer') {
        dependsOn tasks.named('prepareGameTestStructures')
    }
}
