pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// Include these explicitly selected files in source exports. Git directories
// retain Ant's default exclusions and are never publication inputs.
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitignore')
org.apache.tools.ant.DirectoryScanner.removeDefaultExclude('**/.gitattributes')
